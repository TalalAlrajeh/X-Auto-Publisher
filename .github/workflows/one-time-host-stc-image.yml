name: One-time STC image host
on:
  push:
    paths:
      - '.github/workflows/one-time-host-stc-image.yml'
jobs:
  host:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Upload STC analysis image to tmpfiles
        shell: bash
        run: |
          set -euo pipefail
          test -s assets/stc-analysis-h1-2026.jpg
          RESP="$(curl --fail --silent --show-error --retry 2 -F 'file=@assets/stc-analysis-h1-2026.jpg' https://tmpfiles.org/api/v1/upload)"
          echo "$RESP"
          URL="$(printf '%s' "$RESP" | python -c "import sys,json; print(json.load(sys.stdin)['data']['url'].replace('tmpfiles.org/','tmpfiles.org/dl/'))")"
          echo "TMPFILES_URL=$URL"
          curl --fail --silent --show-error --head "$URL" | head
