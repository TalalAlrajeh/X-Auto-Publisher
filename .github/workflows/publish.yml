name: X Auto Publisher
on:
  schedule:
    - cron: '0,20,40 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - '.github/workflows/publish.yml'
permissions:
  contents: read
  issues: write
concurrency:
  group: x-auto-publisher
  cancel-in-progress: false
jobs:
  publisher:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      PUBLISH_ENABLED: ${{ github.event_name == 'push' && 'false' || vars.PUBLISH_ENABLED || 'false' }}
      CHECK_CONNECTION: ${{ github.event_name != 'schedule' && 'true' || 'false' }}
      BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
      BUFFER_CHANNEL_ID: ${{ vars.BUFFER_CHANNEL_ID }}
      BUFFER_ORGANIZATION_ID: ${{ vars.BUFFER_ORGANIZATION_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run safety tests
        run: |
          node --check src/publisher.mjs
          node --test tests/*.test.mjs
      - name: Check free stock data (read-only, code updates only)
        if: github.event_name == 'push'
        env:
          SEC_CONTACT_EMAIL: ${{ vars.SEC_CONTACT_EMAIL || '' }}
        run: |
          node --input-type=module <<'NODE'
          import {prepareStockAnalysis} from './src/stock-analysis.mjs';
          import {local} from './src/publisher.mjs';
          try {
            const thread=await prepareStockAnalysis({day:local(),index:6},[],new Date());
            console.log('FREE STOCK DATA: VERIFIED:',thread.length,'thread items');
          } catch (error) {
            console.log('FREE STOCK DATA: UNAVAILABLE; the qualified Saudi-company fallback will apply:',error.message);
          }
          NODE
      - name: Prepare next post
        run: node src/publisher.mjs
      - name: Create failure incident
        if: failure() && env.PUBLISH_ENABLED == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const {owner,repo}=context.repo;
            const title='X Auto Publisher: publishing needs attention';
            const list=await github.rest.issues.listForRepo({owner,repo,state:'open',per_page:100});
            if(!list.data.some(i=>i.title===title)) await github.rest.issues.create({owner,repo,title,body:'Automation failed. Inspect the latest GitHub Actions run. No ambiguous Buffer request is retried automatically.'});
